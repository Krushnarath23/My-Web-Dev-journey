<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise on designing a nav bar</title>
    <style>
        
        body {
            background-color: rgb(125, 13, 125);
        }

        .logo {
            font-size: 20px;
        }
        nav{
            color: yellow;
            background-color: rgb(131, 132, 82);
            display: flex;
            justify-content: space-around;
            align-items: center;
            cursor: pointer;
            
        }
        .right ul{
            list-style: none;
            display: flex;
            gap: 34px;
            font-size: 15px;
        }      
        
        .box{
            height: 600px;
            width: 600px;
            border: 3px solid black;
            margin: auto;
        
        }
        .box h1{
            text-align: center;
            color: white;
            font-size: 30px;
        }
        .box img{
            height: 500px;
            width: 500px;
            display: flex;
            margin: 0 auto;
            justify-content: center;
            align-items: center;
        }

               
         
       
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            Ultra Edge
        </div>

         <div class="right">
            <ul>
                <li>Product</li>
                <li>Pricing</li>
                <li>Recource</li>
                <li>AboutUs</li>
            </ul>
        </div>
    </nav>
    <div class="box">
        <h1>Hii This is Krushna</h1>
        <img src="RIck and monty wallpaper.jpg" alt="Rick and Morty standing together in a colorful sci-fi landscape with swirling portals and alien creatures in the background, both characters appear adventurous and determined, the scene feels energetic and imaginative">
    </div>

</body>
</html>
