<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoiler Alertr</title>
</head>
<style>
    :root{
        --spoiler-olor: black;
    }
.post {
    border: 1px solid black;
    padding : 10px;
    margin : 10px;
    border-radius: 9px;
    cursor: pointer;
}
.spoiler{
    color: black;
    background-color: black;
    transition: all 0.5s ease-in-out;
    padding: 2px;
}
.spoiler:hover { 
     color: initial;
     background: initial;
}
</style>
<body>
    <div class="post">
            <p>In the 1968 film Planet of the Apes, they find  
                <span class="spoiler">the ruins 
                    of the Statue of Liberty. The Plant of the
                    Apes is Earth!</span>
            </p>
        </div>
        <div class="post">
            <p>Soylent Green  
                <span class="spoiler">is made of people!</span>
            </p>
        </div>
        <div class="post">
            <p>OMG I can't believe that Darth Vadar is 
                <span class="spoiler">Luke Skywalker's father!</span>
            </p>
        </div>
</body>
</html>
